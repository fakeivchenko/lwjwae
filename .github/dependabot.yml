# Weekly updates, one pull request per ecosystem: the versions of the build in
# gradle/libs.versions.toml, the actions of the workflows, which are pinned to commits, and the base
# image of Dockerfile.test.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
