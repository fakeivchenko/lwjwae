name: Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_call:
  workflow_dispatch:
    inputs:
      platform:
        description: The platform to test
        type: choice
        options: [all, linux, windows, macos]
        default: all
      tests:
        description: The display tests to run, as Gradle's --tests takes them; empty for all
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
  GDK_BACKEND: x11
  WEBKIT_DISABLE_DMABUF_RENDERER: "1"
  WEBKIT_DISABLE_COMPOSITING_MODE: "1"
  GSK_RENDERER: cairo
  TESTS: ${{ inputs.tests }}

jobs:
  style:
    name: Style
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Spotless and Checkstyle
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest checkstyleTestFixtures
      - name: Checkstyle reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkstyle-reports
          path: '**/build/reports/checkstyle/'
          if-no-files-found: ignore

  test-linux:
    name: Tests (Linux ${{ matrix.arch }})
    needs: style
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install GTK 3 and 4, WebKitGTK, displays, a notification server, a keyring, and a portal
        run: sudo scripts/linux/install-test-packages.sh

      - name: Headless tests
        run: ./gradlew test

      - name: Allow the WebKitGTK 6.0 sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Display tests under Xvfb
        id: display
        run: >-
          xvfb-run -a dbus-run-session -- scripts/linux/with-secret-service.sh
          scripts/linux/with-window-manager.sh
          ./gradlew displayTest ${TESTS:+--tests "$TESTS"}
          -Dlwjwae.requireDisplay=true -Dlwjwae.screenshots=true

      - name: Smoke test on the module path
        run: xvfb-run -a dbus-run-session -- ./gradlew :lwjwae-smoke:run

      - name: Screenshots
        if: always() && steps.display.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-linux-${{ matrix.arch }}
          path: '**/build/screenshots/'
          if-no-files-found: error

      - name: Jars, Javadoc, and coverage
        run: ./gradlew assemble javadoc jacocoTestReport

      - name: Coverage
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux
          path: '**/build/reports/jacoco/'

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-linux-${{ matrix.arch }}
          path: |
            **/build/reports/tests/
            **/build/test-results/

  test-wayland:
    name: Tests (Linux Wayland)
    needs: style
    if: >-
      github.actor != 'dependabot[bot]'
      && (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install the packages of the tests
        run: sudo scripts/linux/install-test-packages.sh
      - name: Allow the WebKitGTK 6.0 sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Display tests on Wayland
        run: >-
          xvfb-run -a dbus-run-session -- scripts/linux/with-secret-service.sh
          scripts/linux/with-wayland.sh
          ./gradlew :lwjwae-gtk:displayTest :lwjwae-gtk4:displayTest ${TESTS:+--tests "$TESTS"}
          -Dlwjwae.requireDisplay=true
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-wayland
          path: |
            **/build/reports/tests/
            **/build/test-results/

  test-windows:
    name: Tests (Windows)
    needs: style
    if: >-
      github.actor != 'dependabot[bot]'
      && (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'windows')
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Headless tests
        run: ./gradlew test

      - name: Display tests
        id: display
        run: |
          $tests = if ($env:TESTS) { @('--tests', $env:TESTS) } else { @() }
          ./gradlew displayTest @tests "-Dlwjwae.requireDisplay=true" "-Dlwjwae.screenshots=true"

      - name: Smoke test on the module path
        run: ./gradlew :lwjwae-smoke:run

      - name: Screenshots
        if: always() && steps.display.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-windows
          path: '**/build/screenshots/'
          if-no-files-found: error

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-windows
          path: |
            **/build/reports/tests/
            **/build/test-results/

  test-macos:
    name: Tests (macOS ${{ matrix.arch }})
    needs: style
    if: >-
      github.actor != 'dependabot[bot]'
      && (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'macos')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Headless tests
        run: ./gradlew test

      - name: Display tests
        id: display
        run: >-
          ./gradlew displayTest ${TESTS:+--tests "$TESTS"}
          -Dlwjwae.requireDisplay=true -Dlwjwae.screenshots=true

      - name: Smoke test on the module path
        run: ./gradlew :lwjwae-smoke:run

      - name: Screenshots
        if: always() && steps.display.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-macos-${{ matrix.arch }}
          path: '**/build/screenshots/'
          if-no-files-found: error

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-macos-${{ matrix.arch }}
          path: |
            **/build/reports/tests/
            **/build/test-results/

  native:
    name: Native image (${{ matrix.name }})
    needs: style
    if: github.actor != 'dependabot[bot]' && (inputs.platform == '' || inputs.platform == 'all')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: Linux
          - runner: windows-2025
            name: Windows
          - runner: macos-15
            name: macOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: 25
          distribution: graalvm-community
          native-image-job-reports: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install the packages of the tests
        if: runner.os == 'Linux'
        run: |
          sudo scripts/linux/install-test-packages.sh
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the smoke application
        run: ./gradlew :lwjwae-smoke:nativeCompile

      - name: Run it on GTK 3 and GTK 4
        if: runner.os == 'Linux'
        run: |
          for backend in gtk3-webkit2gtk-4.1 gtk4-webkitgtk-6.0; do
            xvfb-run -a dbus-run-session -- lwjwae-smoke/build/native/nativeCompile/lwjwae-smoke \
              "-Dlwjwae.backend=$backend"
          done
      - name: Run it
        if: runner.os == 'Windows'
        run: ./lwjwae-smoke/build/native/nativeCompile/lwjwae-smoke.exe
      - name: Run it
        if: runner.os == 'macOS'
        run: ./lwjwae-smoke/build/native/nativeCompile/lwjwae-smoke
