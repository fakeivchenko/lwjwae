name: Release

on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: --enable-native-access=ALL-UNNAMED

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  version:
    name: Version
    runs-on: ubuntu-24.04
    needs: tests
    outputs:
      version: ${{ steps.semver.outputs.version }}
      version_tag: ${{ steps.semver.outputs.version_tag }}
      is_tagged: ${{ steps.semver.outputs.is_tagged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Calculate semantic version
        id: semver
        uses: paulhatch/semantic-version@5ae1354e589c5a67345fb2c6e65b025ff676d7c7 # v6.0.7
        with:
          tag_prefix: v
          major_pattern: '/!:|BREAKING CHANGE:/'
          minor_pattern: '/feat(\(.+\))?:/'
          version_format: '${major}.${minor}.${patch}'
          bump_each_commit: false
          search_commit_body: true

      - name: Verify build version
        shell: bash
        env:
          PROJECT_VERSION: ${{ steps.semver.outputs.version }}
        run: |
          [[ "$PROJECT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gradle_version="$(
            ./gradlew --no-daemon properties -q -PprojectVersion="$PROJECT_VERSION" |
              sed -n 's/^version: //p'
          )"
          test "$gradle_version" = "$PROJECT_VERSION"

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    needs: version
    permissions:
      contents: write
    env:
      PROJECT_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Publish to the Maven repository
        env:
          REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
          REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
        run: ./gradlew publish -PprojectVersion="$PROJECT_VERSION"

      - name: Tag and GitHub release
        if: needs.version.outputs.is_tagged != 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.version.outputs.version_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
