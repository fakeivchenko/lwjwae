name: Release

# Every push to release: the full test suite, then a version, a publish, and a GitHub release.
on:
  push:
    branches: [release]

# Read for everything but the job that tags the release.
permissions:
  contents: read

# A release always runs to the end.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: --enable-native-access=ALL-UNNAMED

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml


  version:
    name: Version
    runs-on: ubuntu-24.04
    needs: tests
    outputs:
      version: ${{ steps.semver.outputs.version }}
      version_tag: ${{ steps.semver.outputs.version_tag }}
      is_tagged: ${{ steps.semver.outputs.is_tagged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Calculate semantic version
        id: semver
        uses: paulhatch/semantic-version@502226b17e3e242e4befd0a45690fcbb27dd1373 # v6.0.3
        with:
          tag_prefix: v
          major_pattern: '/!:|BREAKING CHANGE:/'
          minor_pattern: '/feat(\(.+\))?:/'
          version_format: '${major}.${minor}.${patch}'
          bump_each_commit: false
          search_commit_body: true

      - name: Verify build version
        shell: bash
        env:
          PROJECT_VERSION: ${{ steps.semver.outputs.version }}
        run: |
          [[ "$PROJECT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gradle_version="$(
            ./gradlew --no-daemon properties -q -PprojectVersion="$PROJECT_VERSION" |
              sed -n 's/^version: //p'
          )"
          test "$gradle_version" = "$PROJECT_VERSION"

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    needs: version
    permissions:
      contents: write
    env:
      PROJECT_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Publish to the Maven repository
        env:
          REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
          REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
        run: ./gradlew publish -PprojectVersion="$PROJECT_VERSION"

      # Creates the tag through the API: unlike a git push with GITHUB_TOKEN, that is not blocked when
      # the released commit touches .github/workflows/*.
      - name: Tag and GitHub release
        if: needs.version.outputs.is_tagged != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.version_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
